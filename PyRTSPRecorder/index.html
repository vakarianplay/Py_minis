<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >
    <title>RTSP ARCHIVE</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171b22;
            --line: #2a3242;
            --text: #e9edf6;
            --muted: #9aa8c2;
            --accent: #58a6ff;
            --danger: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 12px;
        }

        .breadcrumbs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .breadcrumbs a {
            color: #93c5fd;
            text-decoration: none;
        }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            border: 1px solid var(--line);
            background: #1f2735;
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .toolbar-btn:hover {
            border-color: var(--accent);
        }

        .toolbar-btn.danger {
            background: #2b1b1b;
            border-color: #5a2e2e;
            color: #ffc0c0;
        }

        .toolbar-btn.danger:hover {
            border-color: var(--danger);
        }

        .toolbar-btn[disabled] {
            opacity: .45;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }

        th {
            text-align: left;
            color: var(--muted);
            background: #141923;
        }

        tr:hover {
            background: #1b2230;
        }

        .download-link {
            color: #c8d4ea;
            text-decoration: none;
            font-size: 16px;
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #ff9b9b;
            cursor: pointer;
            font-size: 16px;
        }

        .codec-badge {
            display: inline-block;
            padding: 2px 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #121826;
        }

        .inline-player-row td {
            padding: 0;
            background: #0f141d;
        }

        .inline-player-wrap {
            border-top: 1px solid #2a3242;
            padding: 10px;
        }

        .inline-player-title {
            color: #9aa8c2;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .inline-player-video {
            width: 100%;
            max-height: 56vh;
            background: #000;
            border-radius: 8px;
        }

        .inline-player-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🎬 RTSP Recorder Archive</div>
        <div class="subtitle">Web view player for CCTV archive</div>
        <div class="subtitle"><a class='toolbar-btn' href='/live'>🔴 Live</a></div>
        <div class="breadcrumbs">{{BREADCRUMBS}}</div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Size</th>
                    <th>Codec</th>
                    <th>Download</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>{{VIDEO_TABLE_ROWS}}</tbody>
        </table>
    </div>

    <script>
        let selectedRow = null;
        let inlineRow = null;
        let inlineTitle = null;
        let inlinePlayer = null;
        let inlineForPath = null;
        let convTimer = null;

        function ensureInlinePlayerRow() {
            if (inlineRow) {
                return;
            }

            inlineRow = document.createElement("tr");
            inlineRow.className = "inline-player-row inline-player-hidden";

            const td = document.createElement("td");
            const thCount = document.querySelectorAll("table thead th").length || 5;
            td.colSpan = thCount;

            const wrap = document.createElement("div");
            wrap.className = "inline-player-wrap";

            inlineTitle = document.createElement("div");
            inlineTitle.className = "inline-player-title";
            inlineTitle.textContent = "Загрузка...";

            inlinePlayer = document.createElement("video");
            inlinePlayer.className = "inline-player-video";
            inlinePlayer.controls = true;
            inlinePlayer.playsInline = true;

            wrap.appendChild(inlineTitle);
            wrap.appendChild(inlinePlayer);
            td.appendChild(wrap);
            inlineRow.appendChild(td);
        }

        function moveInlineRowAfter(targetRow) {
            const tbody = targetRow.parentNode;
            if (inlineRow.parentNode) {
                inlineRow.parentNode.removeChild(inlineRow);
            }

            if (targetRow.nextSibling) {
                tbody.insertBefore(inlineRow, targetRow.nextSibling);
            } else {
                tbody.appendChild(inlineRow);
            }

            inlineRow.classList.remove("inline-player-hidden");
        }

        function stopConversionTimer() {
            if (convTimer) {
                clearInterval(convTimer);
                convTimer = null;
            }
        }

        function closeInlinePlayer() {
            stopConversionTimer();

            if (inlinePlayer) {
                inlinePlayer.pause();
                inlinePlayer.removeAttribute("src");
                inlinePlayer.load();
            }

            if (inlineRow) {
                inlineRow.classList.add("inline-player-hidden");
            }

            if (selectedRow) {
                selectedRow.style.outline = "";
            }

            selectedRow = null;
            inlineForPath = null;
        }

        async function waitConversion(path, url) {
            stopConversionTimer();
            inlineTitle.textContent = "Конвертация...";

            convTimer = setInterval(async () => {
                try {
                    const r = await fetch(
                        "/status/" + encodeURIComponent(path)
                    );
                    const data = await r.json();

                    if (data.status === "completed" || data.status === "ready") {
                        stopConversionTimer();
                        inlineTitle.textContent = "▶ Готово";
                        inlinePlayer.src = url;
                        inlinePlayer.play().catch(() => {});
                        return;
                    }

                    if (data.status === "converting") {
                        inlineTitle.textContent =
                            "Конвертация... " + data.progress + "%";
                    }
                } catch (_) {
                    stopConversionTimer();
                    inlineTitle.textContent = "Ошибка конвертации";
                }
            }, 1500);
        }

        async function playVideo(url, name, path, row) {
            ensureInlinePlayerRow();

            if (
                inlineForPath === path &&
                !inlineRow.classList.contains("inline-player-hidden")
            ) {
                closeInlinePlayer();
                return;
            }

            stopConversionTimer();

            if (selectedRow) {
                selectedRow.style.outline = "";
            }
            selectedRow = row;
            selectedRow.style.outline = "1px solid #58a6ff";

            inlineForPath = path;
            inlineTitle.textContent = "▶ " + name;
            moveInlineRowAfter(row);

            try {
                const r = await fetch(url, { method: "HEAD" });

                if (r.status === 200) {
                    inlinePlayer.src = url;
                    inlinePlayer.play().catch(() => {});
                    return;
                }

                if (r.status === 202) {
                    await waitConversion(path, url);
                    return;
                }

                inlineTitle.textContent = "Видео недоступно";
            } catch (_) {
                inlineTitle.textContent = "Ошибка открытия видео";
            }
        }

        async function deleteVideo(encodedPath) {
            const path = decodeURIComponent(encodedPath);

            if (!confirm("Удалить видео?\n" + path)) {
                return;
            }

            try {
                const r = await fetch("/api/delete_video", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: path })
                });

                const data = await r.json();

                if (!r.ok || !data.ok) {
                    alert("Ошибка удаления: " + (data.error || r.status));
                    return;
                }

                if (inlineForPath === path) {
                    closeInlinePlayer();
                }

                location.reload();
            } catch (_) {
                alert("Ошибка удаления");
            }
        }

        async function clearDirectory(encodedDir) {
            const dir = decodeURIComponent(encodedDir);

            if (!confirm("Очистить текущую директорию?\n" + dir)) {
                return;
            }

            try {
                const r = await fetch("/api/clear_directory", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dir: dir })
                });

                const data = await r.json();

                if (!r.ok || !data.ok) {
                    alert("Ошибка очистки: " + (data.error || r.status));
                    return;
                }

                closeInlinePlayer();
                location.reload();
            } catch (_) {
                alert("Ошибка очистки директории");
            }
        }
    </script>
</body>
</html>
