<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1"
    >
    <title>RTSP Live</title>
    <style>
        :root {
            --bg: #0f0f12;
            --panel: #17171c;
            --panel-2: #1e1e25;
            --line: #2b2b35;
            --text: #e8e8ef;
            --muted: #a6a6b3;
            --accent: #4da3ff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .topbar {
            height: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .topbar a {
            color: #8cc4ff;
            text-decoration: none;
        }

        .topbar .status {
            margin-left: auto;
            color: #9aa3b0;
            font-size: 13px;
        }

        .viewer {
            height: calc(80vh - 44px);
            min-height: 240px;
            background: #000;
            position: relative;
            border-bottom: 1px solid var(--line);
        }

        .viewer .title {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
        }

        .viewer .hint {
            position: absolute;
            right: 10px;
            top: 10px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.45);
            color: #d5d7dc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .main-body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            background: #000;
        }

        .main-body img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .thumbs-wrap {
            height: 20vh;
            min-height: 110px;
            background: var(--panel);
            padding: 10px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .thumbs {
            display: flex;
            gap: 10px;
            height: 100%;
            width: max-content;
            min-width: 100%;
            justify-content: center;
            align-items: stretch;
        }

        .thumb {
            flex: 0 0 220px;
            height: 100%;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        .thumb:hover {
            border-color: var(--accent);
        }

        .thumb-title {
            height: 28px;
            min-height: 28px;
            font-size: 12px;
            color: var(--muted);
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            background: #202028;
        }

        .thumb-body {
            height: calc(100% - 28px);
            background: #000;
        }

        .thumb-body img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .empty {
            color: var(--muted);
            padding: 12px 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="topbar">
            <strong>🔴 Live-режим</strong>
            <a href="/">Архив</a>
            <span id="status" class="status">Инициализация...</span>
        </div>

        <div class="viewer">
            <div class="title" id="mainTitle">Загрузка камер...</div>
            <div class="main-body" id="mainBody"></div>
        </div>

        <div class="thumbs-wrap">
            <div class="thumbs" id="thumbs"></div>
            <div class="empty" id="empty" style="display:none;">
                Нет камер для отображения.
            </div>
        </div>
    </div>

    <script>
        const state = {
            cameras: [],
            active: null,
            cards: new Map()
        };

        function streamUrl(cameraName) {
            return "/live/stream/" + encodeURIComponent(cameraName);
        }

        function createStreamImg(cam) {
            const img = document.createElement("img");
            img.alt = cam;

            let retryTimer = null;

            const load = () => {
                img.src = streamUrl(cam) + "?t=" + Date.now();
            };

            img.addEventListener("error", () => {
                if (retryTimer) {
                    clearTimeout(retryTimer);
                }
                retryTimer = setTimeout(load, 1500);
            });

            load();
            return img;
        }

        function activateCamera(cam) {
            if (!state.cards.has(cam)) {
                return;
            }
            if (state.active === cam) {
                return;
            }

            const mainBody = document.getElementById("mainBody");
            const mainTitle = document.getElementById("mainTitle");

            if (state.active) {
                const prevEntry = state.cards.get(state.active);
                const currentMainImg = mainBody.querySelector("img");
                if (prevEntry && currentMainImg) {
                    prevEntry.body.appendChild(currentMainImg);
                    prevEntry.card.style.display = "";
                }
            }

            const nextEntry = state.cards.get(cam);
            mainBody.innerHTML = "";
            mainBody.appendChild(nextEntry.img);
            nextEntry.card.style.display = "none";

            state.active = cam;
            mainTitle.textContent = "📷 " + cam;
        }

        function buildUI(cameras) {
            const thumbs = document.getElementById("thumbs");
            const empty = document.getElementById("empty");

            thumbs.innerHTML = "";
            state.cards.clear();
            state.cameras = cameras.slice();
            state.active = null;

            if (state.cameras.length === 0) {
                empty.style.display = "block";
                document.getElementById("mainTitle").textContent =
                    "Камеры не найдены";
                document.getElementById("mainBody").innerHTML = "";
                return;
            }

            empty.style.display = "none";

            for (const cam of state.cameras) {
                const card = document.createElement("button");
                card.className = "thumb";
                card.type = "button";
                card.title = "Сделать активной: " + cam;

                const title = document.createElement("div");
                title.className = "thumb-title";
                title.textContent = "📷 " + cam;

                const body = document.createElement("div");
                body.className = "thumb-body";

                const img = createStreamImg(cam);
                body.appendChild(img);

                card.appendChild(title);
                card.appendChild(body);
                card.addEventListener("click", () => activateCamera(cam));

                thumbs.appendChild(card);
                state.cards.set(cam, { card, body, img });
            }

            activateCamera(state.cameras[0]);

            if (state.cameras.length === 1) {
                empty.style.display = "block";
                empty.textContent = "Подключена только одна камера.";
            }
        }

        function switchCameraByKey(key) {
            if (!state.cameras || state.cameras.length === 0) {
                return;
            }

            let index = -1;

            if (/^[1-9]$/.test(key)) {
                index = parseInt(key, 10) - 1;
            } else if (key === "0") {
                index = 9;
            } else {
                return;
            }

            if (index < 0 || index >= state.cameras.length) {
                return;
            }

            activateCamera(state.cameras[index]);
        }

        document.addEventListener("keydown", (e) => {
            const tag = (e.target && e.target.tagName || "").toLowerCase();
            if (tag === "input" || tag === "textarea" || e.target.isContentEditable) {
                return;
            }

            switchCameraByKey(e.key);
        });

        async function loadCameras() {
            const status = document.getElementById("status");

            try {
                status.textContent = "Загрузка списка камер...";
                const res = await fetch("/live/cameras.json", {
                    cache: "no-store"
                });

                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                const data = await res.json();
                const cameras = Array.isArray(data.cameras) ? data.cameras : [];

                buildUI(cameras);
                status.textContent = "Камер: " + cameras.length;
            } catch (e) {
                console.error(e);
                status.textContent = "Ошибка загрузки камер";
                buildUI([]);
            }
        }

        loadCameras();
    </script>
</body>
</html>
