<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RTSP Live</title>
    <style>
        :root {
            --bg: #0f0f12;
            --panel: #17171c;
            --panel-2: #1e1e25;
            --line: #2b2b35;
            --text: #e8e8ef;
            --muted: #a6a6b3;
            --accent: #4da3ff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .topbar {
            height: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .topbar a {
            color: #8cc4ff;
            text-decoration: none;
        }

        .viewer {
            height: calc(80vh - 44px);
            min-height: 240px;
            background: #000;
            position: relative;
            border-bottom: 1px solid var(--line);
        }

        .viewer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
        }

        .viewer .title {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
        }

        .thumbs-wrap {
        height: 20vh;
        min-height: 110px;
        background: var(--panel);
        padding: 10px;
        overflow-x: auto;
        overflow-y: hidden;
    }

    .thumbs {
        display: flex;
        gap: 10px;
        height: 100%;
        width: max-content;
        min-width: 100%;
        justify-content: center;
        align-items: stretch;
    }

        .thumb {
            flex: 0 0 220px;
            height: 100%;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .thumb:hover {
            border-color: var(--accent);
        }

        .thumb .thumb-title {
            height: 28px;
            min-height: 28px;
            font-size: 12px;
            color: var(--muted);
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .thumb img {
            width: 100%;
            height: calc(100% - 28px);
            object-fit: cover;
            display: block;
            background: #000;
        }

        .empty {
            color: var(--muted);
            padding: 14px;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="topbar">
            <strong>🔴 Live-режим</strong>
            <a href="/">Архив</a>
            <span id="status" style="color:#9aa3b0;font-size:13px;"></span>
        </div>

        <div class="viewer">
            <img id="mainStream" alt="active camera">
            <div class="title" id="mainTitle">Загрузка камер...</div>
        </div>

        <div class="thumbs-wrap">
            <div class="thumbs" id="thumbs"></div>
            <div class="empty" id="empty" style="display:none;">
                Нет камер для отображения.
            </div>
        </div>
    </div>

    <script>
        const state = {
            cameras: [],
            active: null
        };

        function streamUrl(cameraName) {
            return "/live/stream/" + encodeURIComponent(cameraName);
        }

        function attachMjpeg(img, url) {
            let retryTimer = null;

            const load = () => {
                img.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
            };

            img.onerror = () => {
                if (retryTimer) clearTimeout(retryTimer);
                retryTimer = setTimeout(load, 2000);
            };

            load();
        }

        function setActive(cameraName) {
            state.active = cameraName;
            renderMain();
            renderThumbs();
        }

        function renderMain() {
            const main = document.getElementById("mainStream");
            const title = document.getElementById("mainTitle");

            if (!state.active) {
                title.textContent = "Камеры не найдены";
                main.removeAttribute("src");
                return;
            }

            title.textContent = "📷 " + state.active;
            attachMjpeg(main, streamUrl(state.active));
        }

        function renderThumbs() {
            const holder = document.getElementById("thumbs");
            const empty = document.getElementById("empty");
            holder.innerHTML = "";

            const others = state.cameras.filter(c => c !== state.active);

            if (!state.active) {
                empty.style.display = "block";
                return;
            }

            if (others.length === 0) {
                empty.style.display = "block";
                empty.textContent = "Подключена только одна камера.";
                return;
            }

            empty.style.display = "none";

            for (const cam of others) {
                const card = document.createElement("button");
                card.className = "thumb";
                card.type = "button";
                card.title = "Сделать активной: " + cam;

                const t = document.createElement("div");
                t.className = "thumb-title";
                t.textContent = "📷 " + cam;

                const img = document.createElement("img");
                img.alt = cam;
                attachMjpeg(img, streamUrl(cam));

                card.appendChild(t);
                card.appendChild(img);
                card.addEventListener("click", () => setActive(cam));

                holder.appendChild(card);
            }
        }

        async function loadCameras() {
            const status = document.getElementById("status");

            try {
                status.textContent = "Загрузка списка камер...";
                const res = await fetch("/live/cameras.json", { cache: "no-store" });
                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }

                const data = await res.json();
                state.cameras = Array.isArray(data.cameras) ? data.cameras : [];

                if (state.cameras.length > 0) {
                    setActive(state.cameras[0]);
                    status.textContent = "Камер: " + state.cameras.length;
                } else {
                    state.active = null;
                    renderMain();
                    renderThumbs();
                    status.textContent = "Камер: 0";
                }
            } catch (e) {
                status.textContent = "Ошибка загрузки камер";
                console.error(e);
                state.active = null;
                renderMain();
                renderThumbs();
            }
        }

        loadCameras();
    </script>
</body>
</html>
